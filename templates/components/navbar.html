<nav class="cabzy-navbar sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
        <!-- Brand Logo -->
        <a href="{% if request.session.is_driver %}{% url 'driver-dashboard' %}{% else %}{% url 'user-dashboard' %}{% endif %}" class="navbar-brand-custom text-decoration-none d-flex align-items-center">
            <span class="fw-extrabold fs-4 text-dark-brown">Cab<span class="text-primary-red">Zy</span></span>
        </a>

        <!-- Operation Links & Username -->
        <div class="d-flex align-items-center gap-3 gap-md-4">
            <!-- Operations: Dashboard & Profile Only -->
            {% if request.session.is_driver %}
            <a href="{% url 'driver-dashboard' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'driver-dashboard' or request.resolver_match.url_name == 'driver-dashboard-alt' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'driver-profile' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'driver-profile' or request.resolver_match.url_name == 'driver-profile-alt' %}active{% endif %}">
                Profile
            </a>
            {% else %}
            <a href="{% url 'user-dashboard' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'user-dashboard' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'user-dashboard' %}" class="nav-link-animated">
                Profile
            </a>
            {% endif %}
            
            <!-- User Profile Dropdown Displaying Username & Logout Only -->
            <div class="dropdown ms-1 ms-md-2">
                <button class="btn btn-user-profile dropdown-toggle d-flex align-items-center px-3 py-2 border rounded-3 bg-white shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="fw-bold text-dark-brown">{{ request.session.user_name|default:'Account' }}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-beige animate-slide-down p-2 mt-2" style="min-width: 200px;">
                    <li class="px-3 py-2 text-muted small border-bottom mb-1">
                        Signed in as <strong class="text-dark d-block text-truncate">{{ request.session.user_name|default:'Account' }}</strong>
                    </li>
                    <li>
                        <a class="dropdown-item text-danger fw-bold rounded-2 py-2 text-center" href="{% if request.session.is_driver %}{% url 'driver-logout' %}{% else %}{% url 'user_logout' %}{% endif %}">
                            Sign Out / Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
