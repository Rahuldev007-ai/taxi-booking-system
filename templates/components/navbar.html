<nav class="cabzy-navbar sticky-top py-2">
    <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">
        <!-- Pure Brand Logo -->
        <a href="{% if request.session.is_driver %}{% url 'driver-dashboard' %}{% else %}{% url 'user-dashboard' %}{% endif %}" class="navbar-brand-custom text-decoration-none d-flex align-items-center gap-2">
            <span class="fs-4 fw-extrabold text-white" style="letter-spacing: -0.03em; font-family: var(--nest-font-sans);">Cab<span class="text-primary-red">Zy</span>.</span>
        </a>

        <!-- Desktop Navigation & Profile Pills -->
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-md-flex align-items-center gap-2">
                {% if request.session.is_driver %}
                <a href="{% url 'driver-dashboard' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'driver-dashboard' or request.resolver_match.url_name == 'driver-dashboard-alt' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'driver-profile' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'driver-profile' or request.resolver_match.url_name == 'driver-profile-alt' %}active{% endif %}">
                    Profile
                </a>
                {% else %}
                <a href="{% url 'user-dashboard' %}" class="nav-link-animated {% if request.resolver_match.url_name == 'user-dashboard' %}active{% endif %}">
                    Book & Ride
                </a>
                <a href="{% url 'user-dashboard' %}#my-rides" class="nav-link-animated">
                    My Journeys
                </a>
                <a href="{% url 'user-dashboard' %}#how-it-works" class="nav-link-animated">
                    How it works
                </a>
                <a href="{% url 'user-dashboard' %}#faq-section" class="nav-link-animated">
                    FAQ
                </a>
                {% endif %}
            </div>
            
            <!-- Profile / Account Dropdown Pill -->
            <div class="dropdown">
                <button class="btn btn-user-profile dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                    <span class="fw-bold small">{{ request.session.user_name|default:'Account' }}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 p-2 mt-2 animate-slide-down" style="min-width: 220px; background-color: var(--nest-surface);">
                    <li class="px-3 py-2 border-bottom mb-1">
                        <span class="text-muted d-block small" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;">Signed in as</span>
                        <strong class="text-dark d-block text-truncate">{{ request.session.user_name|default:'Rider' }}</strong>
                    </li>
                    <li class="d-md-none">
                        <a class="dropdown-item py-2 fw-semibold rounded-3 text-dark" href="{% if request.session.is_driver %}{% url 'driver-dashboard' %}{% else %}{% url 'user-dashboard' %}{% endif %}">Dashboard</a>
                    </li>
                    <li>
                        <a class="dropdown-item text-danger fw-bold rounded-3 py-2 mt-1 text-center" href="{% if request.session.is_driver %}{% url 'driver-logout' %}{% else %}{% url 'user_logout' %}{% endif %}">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
