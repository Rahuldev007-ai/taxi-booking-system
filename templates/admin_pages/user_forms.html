{% extends 'components/base.html' %}

{% block title %}{{ action_title }} | Admin Portal{% endblock %}

{% block content %}
<div class="admin-layout-wrapper">

    {% include 'components/sidebar.html' %}

   <main class="admin-main-content">

        <header class="dashboard-header-bar mb-4">
            <div class="container-fluid d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-dark btn-sm rounded-3 fw-bold d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebarOffcanvas" aria-controls="adminSidebarOffcanvas">
                        Menu
                    </button>
                    <span class="dashboard-brand-title">Edit User</span>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <a href="/admin/users/" class="btn btn-outline-secondary btn-sm rounded-3 px-3 fw-bold">
                        Back to Users
                    </a>
                </div>
            </div>
        </header>

        <div class="container-fluid px-3 px-lg-4 pb-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="dashboard-card p-4">
                        <h3 class="dashboard-card-title mb-3">Edit User</h3>

                        <form method="post">
                            <input type="hidden" name="csrfmiddlewaretoken" value="">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" name="name" class="form-control custom-input" placeholder="Enter user's full name" value="John Doe" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Email Address</label>
                                <input type="email" name="email" class="form-control custom-input" placeholder="Enter email address" value="john.doe@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mobile Number</label>
                                <input type="text" name="mobile" class="form-control custom-input" placeholder="Enter mobile number" value="+91 98765 43210" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Password <span class="text-muted fw-normal">(Leave blank to keep current password)</span></label>
                                <input type="password" name="password" class="form-control custom-input" placeholder="Enter password">
                            </div>

                            <div class="mb-4 form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_active" id="is_active_check" checked>
                                <label class="form-check-label fw-bold" for="is_active_check">Active Account Status</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-custom-primary rounded-3 px-4 fw-bold">
                                    Save Changes
                                </button>
                                <a href="/users/" class="btn btn-outline-secondary rounded-3 px-4">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>
{% endblock %}
